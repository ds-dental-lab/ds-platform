<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    놓을 위치: src/app/icon.svg  (Next 앱 라우터 규약 — 브라우저 탭 아이콘)

    denflow_C_v2_symbol 마크로 교체 (2026-08-14).

    ★ 탭 아이콘은 마크 원본과 **일부러 다릅니다.**
      ① 남색 타일 위에 흰 선으로 뒤집었습니다 — 16px 에서는 덩어리가
         있어야 눈에 걸립니다. 꼬리만 청록 그대로 둡니다(남색 위에서
         충분히 보입니다).
      ② 들어오고 나가는 가로선을 줄였습니다 (8→14, 112→106).
         원본대로 두면 능선 둘이 상대적으로 작아져 16px 에서 실오라기가
         됩니다. 능선이 이 마크의 얼굴입니다.
      ③ 획을 9 → 13 으로 키웠습니다. 줄인 뒤 16px 에서 1.8px 가 되는
         값입니다 — 지난 마크들을 16/32px 로 찍어 보며 배운 하한입니다.

    ★ 가운데 맞춤은 줄인 뒤의 잉크 기준입니다.
      가로 중심 60, 세로 중심 56 (능선 위 30 ~ 바닥선 82).

    ★ 파비콘을 바꿨으니 브라우저가 캐시를 오래 잡습니다.
      탭에서 옛것이 보이면 고장이 아니라 캐시입니다.
  -->
  <rect width="100" height="100" rx="22" fill="#16324F"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="13"
     transform="translate(50 50) scale(0.85) translate(-60 -56)">
    <path d="M14 82 H 24
             C 33 82, 27 44, 44 34
             C 51 30, 55 40, 60 40
             C 65 40, 69 30, 76 34
             C 93 44, 87 82, 96 82" stroke="#FFFFFF"/>
    <path d="M96 82 H 106" stroke="#14B8A6"/>
  </g>
</svg>
